name: Create Voyager Release

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v*-voyager'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-binaries:
    name: Build ${{ matrix.target.id }}
    runs-on: ${{ matrix.target.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: win-x64
            runs_on: windows-latest
            output_file: voyager-summarizer-win-x64.exe
          - id: linux-x64
            runs_on: ubuntu-latest
            output_file: voyager-summarizer-linux-x64
          # No Intel Mac (macos-x64) build: Node 25's single executables crash at start on Intel
          # Macs, and V2 has no Intel Mac users (user, 2026-11-12).
          - id: macos-arm64
            runs_on: macos-15
            output_file: voyager-summarizer-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '25.x'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fill Version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          # The summarizer's version, from the release tag
          VERSION="${GITHUB_REF_NAME#v}"; VERSION="${VERSION%-voyager}"
          awk -v v="$VERSION" -v q="'" '!/^  \.version\(/ {print} /^  \.version\(/ {print "  .version(" q v q ");"}' src/summarizer.ts > src/summarizer.ts.tmp
          mv src/summarizer.ts.tmp src/summarizer.ts

      - name: Build SEA binary
        run: npm run build:sea

      - name: Verify binary exists
        run: |
          node -e "require('node:fs').accessSync('dist/sea/${{ matrix.target.output_file }}')"

      # Developer ID signing + Apple notarization (hardened runtime), so Gatekeeper
      # accepts the program even when the zip was downloaded with a browser (quarantine).
      # Same secrets and steps as honeydew's release (dxworks/honeydew#72). Without the
      # secrets it keeps the ad-hoc seal, which Apple Silicon needs to start the program at all.
      - name: Sign macOS binary
        if: runner.os == 'macOS'
        env:
          BIN: dist/sea/${{ matrix.target.output_file }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          # App Store Connect API team key (role Developer) for the notary service.
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_CERT_P12_BASE64" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::warning::macOS signing secrets not set; ${{ matrix.target.id }} ships ad-hoc signed only (not notarized)."
            codesign --sign - --force "$BIN"
            exit 0
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(openssl rand -base64 24)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          # Developer ID certs are issued by Apple's G2 intermediate, which a fresh
          # macOS install may lack; without it the identity is not valid for signing.
          # Pinned SHA-256 of Apple's DeveloperIDG2CA.cer (valid until 2031-09-17); a different file stops the release.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $RUNNER_TEMP/DeveloperIDG2CA.cer" | shasum -a 256 -c -
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true
          security set-key-partition-list -S apple-tool:,apple: -k "$kc_pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          identity="$(security find-identity -v -p codesigning "$keychain" | grep 'Developer ID Application' | head -1 | awk '{print $2}')"
          if [ -z "$identity" ]; then echo "::error::No 'Developer ID Application' identity in the certificate."; exit 1; fi

          codesign --force --options runtime --timestamp \
            --entitlements .github/macos/node-sea.entitlements \
            --sign "$identity" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          # The hardened runtime must not stop Node from starting (V8 needs the JIT entitlements).
          "$BIN" --version

          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
          notary_auth=(--key "$RUNNER_TEMP/notary-key.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")

          ditto -c -k --keepParent "$BIN" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${notary_auth[@]}" \
            --wait --timeout 2h --output-format json | tee "$RUNNER_TEMP/notary.json"
          status="$(plutil -extract status raw -o - "$RUNNER_TEMP/notary.json" 2>/dev/null || true)"
          if [ "$status" != "Accepted" ]; then
            id="$(plutil -extract id raw -o - "$RUNNER_TEMP/notary.json" 2>/dev/null || true)"
            [ -n "$id" ] && xcrun notarytool log "$id" "${notary_auth[@]}" || true
            echo "::error::Notarization status: ${status:-unknown}"
            exit 1
          fi

      - name: Remove signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/cert.p12"

      - name: Upload SEA binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: voyager-summarizer-${{ matrix.target.id }}
          path: dist/sea/${{ matrix.target.output_file }}
          retention-days: 1

  package:
    name: Package voyager-summarizer
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download SEA binaries
        uses: actions/download-artifact@v4
        with:
          pattern: voyager-summarizer-*
          path: artifacts
          merge-multiple: true

      - name: Extract Semver
        if: startsWith(github.ref, 'refs/tags/')
        id: semver_parser
        run: |
          semver=${TAG#"refs/tags/v"}
          semver=${semver%"-voyager"}
          echo "semver=$semver" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.ref }}

      - name: Prepare Assets
        run: |
          mkdir -p voyager-summarizer/results
          cp instrument.v2.yml voyager-summarizer/instrument.v2.yml
          cp artifacts/voyager-summarizer-win-x64.exe voyager-summarizer/
          cp artifacts/voyager-summarizer-linux-x64 voyager-summarizer/
          cp artifacts/voyager-summarizer-macos-arm64 voyager-summarizer/
          chmod +x voyager-summarizer/voyager-summarizer-linux-x64
          chmod +x voyager-summarizer/voyager-summarizer-macos-arm64

      - name: Fill Version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # The tool's version, from the release tag, in the V2 manifest
          f=voyager-summarizer/instrument.v2.yml
          awk -v v="$VERSION" '!/^version:/ {print} /^name:/ {print "version: " v}' "$f" > "$f.tmp"
          mv "$f.tmp" "$f"
        env:
          VERSION: ${{ steps.semver_parser.outputs.semver }}

      - name: Create Archive
        run: zip -r voyager-summarizer-voyager.zip voyager-summarizer

      - name: Upload voyager-summarizer package
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: voyager-summarizer-voyager
          path: voyager-summarizer-voyager.zip

      - name: Delete older packages of this PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          # Keep only the newest PR build: remove the package zips of this PR's earlier runs
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=voyager-summarizer-voyager" \
            -q '.artifacts[] | select(.workflow_run.head_branch == env.PR_BRANCH and .workflow_run.id < (env.GITHUB_RUN_ID | tonumber)) | .id' \
            | while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; done

      - name: Prepare Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p releaseNotes
          touch ${{ github.workspace }}/releaseNotes/v${{ steps.semver_parser.outputs.semver }}.md

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: Voyager Summarizer ${{ steps.semver_parser.outputs.semver }} (Voyager)
          body_path: ${{ github.workspace }}/releaseNotes/v${{ steps.semver_parser.outputs.semver }}.md
          body: ""
          prerelease: false
          draft: true
          fail_on_unmatched_files: true
          files: voyager-summarizer-voyager.zip
